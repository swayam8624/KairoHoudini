name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-neutral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out shared pipeline core
        uses: actions/checkout@v4
        with:
          repository: swayam8624/KairoPipelineCore
          path: KairoPipelineCore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        env:
          PYTHONPATH: KairoPipelineCore/src:scripts/python
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q scripts/python tests
      - name: Validate package descriptors
        run: |
          python -m json.tool packages/kairo_houdini.json >/dev/null
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("toolbar/KairoCacheGuard.shelf")
          PY
